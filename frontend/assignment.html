<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234338ca'/%3E%3Cpath d='M9 22V10h3v12zm6 0V10h5.2a4 4 0 0 1 0 8H18v4z' fill='%23fff'/%3E%3C/svg%3E">
  <title>Assignment · InternPath</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Raleway:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-header"></header>

  <!-- S6 Assignment Detail -->
  <main class="container container--narrow stack" id="main" tabindex="-1">
    <div>
      <a class="back-link" href="assignments.html">&larr; All assignments</a>
      <div class="page-head">
        <div>
          <h1 id="assignment-title">Assignment</h1>
          <p id="assignment-meta"></p>
        </div>
        <span class="badges" id="assignment-badges"></span>
      </div>
    </div>

    <section class="card" id="brief" aria-labelledby="brief-title" hidden>
      <h2 id="brief-title">What to do</h2>
      <p class="prose" id="assignment-description"></p>
    </section>

    <section class="stack stack--sm" id="work" aria-labelledby="work-title" hidden>
      <h2 id="work-title">Your submission</h2>
      <div class="stack stack--sm" id="submissions"></div>

      <form class="card form" id="submission-form" hidden>
        <h2 id="form-title">Submit your work</h2>
        <div class="field">
          <label for="response_text">Response</label>
          <textarea id="response_text" name="response_text" required minlength="10" maxlength="3000"
                    aria-describedby="response-hint"></textarea>
          <p class="field__hint" id="response-hint">Describe what you did, in 10 to 3000 characters.</p>
        </div>
        <div class="field">
          <label for="link">Link <span class="field__optional">(optional)</span></label>
          <input id="link" name="link" type="url" inputmode="url" placeholder="https://" maxlength="500"
                 aria-describedby="link-hint">
          <p class="field__hint" id="link-hint">A repo, document or demo, starting with http:// or https://</p>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn" id="submit-btn">Submit</button>
        </div>
      </form>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script src="js/assignment.js"></script>
</body>
</html>
