<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234338ca'/%3E%3Cpath d='M9 22V10h3v12zm6 0V10h5.2a4 4 0 0 1 0 8H18v4z' fill='%23fff'/%3E%3C/svg%3E">
  <title>Profile · InternPath</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Raleway:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-header"></header>

  <!-- S11 Profile -->
  <main class="container container--narrow stack" id="main" tabindex="-1">
    <div class="page-head">
      <div>
        <h1>Profile</h1>
        <p>Your account details.</p>
      </div>
    </div>

    <section class="card" aria-labelledby="details-title">
      <h2 id="details-title">Details</h2>
      <dl class="details" id="profile"></dl>
    </section>

    <form class="card form" id="profile-form" aria-labelledby="edit-title">
      <div>
        <h2 id="edit-title">Edit profile</h2>
        <p class="field__hint" id="edit-hint"></p>
      </div>
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name" required minlength="2" maxlength="60" data-label="Name">
      </div>
      <fieldset class="form-row" id="intern-fields" hidden disabled>
        <legend class="visually-hidden">Internship details</legend>
        <div class="field">
          <label for="domain">Domain</label>
          <input id="domain" name="domain" type="text" required minlength="2" maxlength="60">
        </div>
        <div class="field">
          <label for="batch">Batch</label>
          <input id="batch" name="batch" type="text" required minlength="2" maxlength="60">
        </div>
      </fieldset>
      <div class="form-actions">
        <button type="submit" class="btn">Save changes</button>
      </div>
    </form>
  </main>

  <script src="js/app.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
