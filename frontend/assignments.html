<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234338ca'/%3E%3Cpath d='M9 22V10h3v12zm6 0V10h5.2a4 4 0 0 1 0 8H18v4z' fill='%23fff'/%3E%3C/svg%3E">
  <title>Assignments · InternPath</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Raleway:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-header"></header>

  <!-- S5 Assignments -->
  <main class="container stack" id="main" tabindex="-1">
    <div class="page-head">
      <div>
        <h1>Assignments</h1>
        <p>Sorted by due date, soonest first.</p>
      </div>
      <button type="button" class="btn" id="add-assignment" hidden>Add assignment</button>
    </div>

    <form class="filters" id="filters" aria-label="Filter assignments">
      <div class="field">
        <label for="filter-module">Module</label>
        <select id="filter-module" name="module_id">
          <option value="">All modules</option>
        </select>
      </div>
      <div class="field">
        <label for="filter-status">Status</label>
        <select id="filter-status" name="status">
          <option value="">All statuses</option>
          <option>Not Submitted</option>
          <option>Pending</option>
          <option>Reviewed</option>
          <option>Needs Rework</option>
          <option>Overdue</option>
        </select>
      </div>
    </form>

    <p class="result-count" id="result-count" role="status"></p>
    <div id="assignments"></div>
  </main>

  <dialog id="assignment-dialog" aria-labelledby="assignment-dialog-title">
    <h2 id="assignment-dialog-title">Add assignment</h2>
    <form class="form" id="assignment-form">
      <div class="field">
        <label for="module_id">Module</label>
        <select id="module_id" name="module_id" required data-type="number">
          <option value="">Select a module</option>
        </select>
      </div>
      <div class="field">
        <label for="title">Title</label>
        <input id="title" name="title" type="text" required minlength="3" maxlength="100">
      </div>
      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" name="description" required maxlength="2000"></textarea>
      </div>
      <div class="field">
        <label for="due_date">Due date</label>
        <input id="due_date" name="due_date" type="date" required aria-describedby="due-hint"
               data-range-error="Due date must be today or later">
        <p class="field__hint" id="due-hint">Today or later.</p>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn--secondary" data-close>Cancel</button>
        <button type="submit" class="btn">Save assignment</button>
      </div>
    </form>
  </dialog>

  <script src="js/app.js"></script>
  <script src="js/assignments.js"></script>
</body>
</html>
