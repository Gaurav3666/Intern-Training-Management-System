<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234338ca'/%3E%3Cpath d='M9 22V10h3v12zm6 0V10h5.2a4 4 0 0 1 0 8H18v4z' fill='%23fff'/%3E%3C/svg%3E">
  <title>Dashboard · InternPath</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Raleway:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-header"></header>

  <!-- S3 Intern Dashboard -->
  <main class="container stack" id="main" tabindex="-1">
    <div class="page-head">
      <div>
        <h1 id="greeting">Dashboard</h1>
        <p>Your training progress at a glance.</p>
      </div>
    </div>

    <div id="log-status"></div>

    <section class="grid" id="stats" aria-label="Progress summary"></section>

    <section class="card" aria-labelledby="upcoming-title">
      <h2 id="upcoming-title">Upcoming assignments</h2>
      <div id="upcoming"></div>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script src="js/intern-dashboard.js"></script>
</body>
</html>
