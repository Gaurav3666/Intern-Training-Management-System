<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234338ca'/%3E%3Cpath d='M9 22V10h3v12zm6 0V10h5.2a4 4 0 0 1 0 8H18v4z' fill='%23fff'/%3E%3C/svg%3E">
  <title>Review submissions · InternPath</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Raleway:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-header"></header>

  <!-- S9 Review Submissions -->
  <main class="container stack" id="main" tabindex="-1">
    <div class="page-head">
      <div>
        <h1>Review submissions</h1>
        <p>Work from your interns, newest first.</p>
      </div>
    </div>

    <form class="filters" id="filters" aria-label="Filter submissions">
      <div class="field">
        <label for="filter-intern">Intern</label>
        <select id="filter-intern" name="intern_id">
          <option value="">All interns</option>
        </select>
      </div>
      <div class="field">
        <label for="filter-module">Module</label>
        <select id="filter-module" name="module_id">
          <option value="">All modules</option>
        </select>
      </div>
      <div class="field">
        <label for="filter-status">Status</label>
        <select id="filter-status" name="status">
          <option value="">All statuses</option>
          <option>Pending</option>
          <option>Reviewed</option>
          <option>Needs Rework</option>
        </select>
      </div>
    </form>

    <p class="result-count" id="result-count" role="status"></p>
    <div class="stack stack--sm" id="submissions"></div>
  </main>

  <dialog id="review-dialog" aria-labelledby="review-dialog-title">
    <h2 id="review-dialog-title">Review submission</h2>
    <p class="muted" id="review-context" style="margin-bottom:16px"></p>
    <form class="form" id="review-form">
      <fieldset class="field">
        <legend>Decision</legend>
        <div class="segmented">
          <label><input type="radio" name="status" value="Reviewed"> Reviewed</label>
          <label><input type="radio" name="status" value="Needs Rework"> Needs Rework</label>
        </div>
      </fieldset>
      <div class="field">
        <label for="feedback">Feedback</label>
        <textarea id="feedback" name="feedback" maxlength="1000" aria-describedby="feedback-hint"></textarea>
        <p class="field__hint" id="feedback-hint">Required when you ask for rework. Optional otherwise.</p>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn--secondary" data-close>Cancel</button>
        <button type="submit" class="btn">Save review</button>
      </div>
    </form>
  </dialog>

  <script src="js/app.js"></script>
  <script src="js/reviews.js"></script>
</body>
</html>
