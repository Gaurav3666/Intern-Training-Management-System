<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234338ca'/%3E%3Cpath d='M9 22V10h3v12zm6 0V10h5.2a4 4 0 0 1 0 8H18v4z' fill='%23fff'/%3E%3C/svg%3E">
  <title>Intern · InternPath</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Raleway:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-header"></header>

  <!-- S10 Intern Detail -->
  <main class="container stack" id="main" tabindex="-1">
    <div>
      <a class="back-link" href="mentor-dashboard.html">&larr; Dashboard</a>
      <div class="page-head">
        <div>
          <h1 id="intern-name">Intern</h1>
          <p id="intern-meta"></p>
        </div>
      </div>
    </div>

    <div id="detail" class="stack" hidden>
      <div class="tabs" role="tablist" aria-label="Intern details">
        <button type="button" class="tab" role="tab" id="tab-profile" aria-controls="panel-profile" aria-selected="true">Profile</button>
        <button type="button" class="tab" role="tab" id="tab-progress" aria-controls="panel-progress" aria-selected="false" tabindex="-1">Progress</button>
        <button type="button" class="tab" role="tab" id="tab-submissions" aria-controls="panel-submissions" aria-selected="false" tabindex="-1">Submissions</button>
        <button type="button" class="tab" role="tab" id="tab-logs" aria-controls="panel-logs" aria-selected="false" tabindex="-1">Logs</button>
      </div>

      <section role="tabpanel" id="panel-profile" aria-labelledby="tab-profile" tabindex="0">
        <div class="card"><dl class="details" id="profile"></dl></div>
      </section>

      <section role="tabpanel" id="panel-progress" aria-labelledby="tab-progress" tabindex="0" hidden>
        <div class="grid" id="progress"></div>
      </section>

      <section role="tabpanel" id="panel-submissions" aria-labelledby="tab-submissions" tabindex="0" hidden>
        <div class="stack stack--sm" id="submissions"></div>
      </section>

      <section role="tabpanel" id="panel-logs" aria-labelledby="tab-logs" tabindex="0" class="stack stack--sm" hidden>
        <form class="filters" id="log-filters" aria-label="Filter logs by date">
          <div class="field">
            <label for="from">From</label>
            <input id="from" name="from" type="date">
          </div>
          <div class="field">
            <label for="to">To</label>
            <input id="to" name="to" type="date">
          </div>
          <button type="submit" class="btn btn--secondary">Apply</button>
          <button type="reset" class="btn btn--secondary">Clear</button>
        </form>
        <p class="result-count" id="log-count" role="status"></p>
        <div id="logs"></div>
      </section>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/intern.js"></script>
</body>
</html>
