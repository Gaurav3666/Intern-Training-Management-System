<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234338ca'/%3E%3Cpath d='M9 22V10h3v12zm6 0V10h5.2a4 4 0 0 1 0 8H18v4z' fill='%23fff'/%3E%3C/svg%3E">
  <title>Daily logs · InternPath</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Raleway:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-header"></header>

  <!-- S7 Daily Logs -->
  <main class="container stack" id="main" tabindex="-1">
    <div class="page-head">
      <div>
        <h1>Daily logs</h1>
        <p>One short entry per day. You can edit an entry on the day you create it.</p>
      </div>
    </div>

    <form class="card form" id="log-form" aria-labelledby="log-form-title">
      <h2 id="log-form-title" tabindex="-1">Add a log</h2>
      <div class="form-row">
        <div class="field">
          <label for="log_date">Date</label>
          <input id="log_date" name="log_date" type="date" required
                 data-range-error="Date must be within your internship and not in the future">
        </div>
        <div class="field">
          <label for="hours">Hours worked</label>
          <input id="hours" name="hours" type="number" required min="0.5" max="12" step="0.5" inputmode="decimal"
                 aria-describedby="hours-hint" data-label="Hours">
          <p class="field__hint" id="hours-hint">0.5 to 12, in half hours.</p>
        </div>
      </div>
      <div class="field">
        <label for="description">What did you work on?</label>
        <textarea id="description" name="description" required minlength="10" maxlength="1000" data-label="Description"></textarea>
      </div>
      <div class="field">
        <label for="blockers">Blockers <span class="field__optional">(optional)</span></label>
        <textarea id="blockers" name="blockers" maxlength="500" aria-describedby="blockers-hint" style="min-height:72px"></textarea>
        <p class="field__hint" id="blockers-hint">Anything slowing you down. Your mentor sees this.</p>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn--secondary" id="cancel-edit" hidden>Cancel edit</button>
        <button type="submit" class="btn" id="save-log">Save log</button>
      </div>
    </form>

    <section class="stack stack--sm" aria-labelledby="history-title">
      <h2 id="history-title">History</h2>
      <form class="filters" id="log-filters" aria-label="Filter logs by date">
        <div class="field">
          <label for="from">From</label>
          <input id="from" name="from" type="date">
        </div>
        <div class="field">
          <label for="to">To</label>
          <input id="to" name="to" type="date">
        </div>
        <button type="submit" class="btn btn--secondary">Apply</button>
        <button type="reset" class="btn btn--secondary">Clear</button>
      </form>
      <p class="result-count" id="result-count" role="status"></p>
      <div id="logs"></div>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script src="js/logs.js"></script>
</body>
</html>
