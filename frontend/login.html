<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234338ca'/%3E%3Cpath d='M9 22V10h3v12zm6 0V10h5.2a4 4 0 0 1 0 8H18v4z' fill='%23fff'/%3E%3C/svg%3E">
  <title>Log in · InternPath</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Raleway:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- S1 Login -->
  <main class="auth" id="main">
    <div class="auth__panel">
      <p class="brand auth__brand">Intern<span>Path</span></p>
      <div class="card stack">
        <div>
          <h1>Log in</h1>
          <p class="muted">Welcome back. Pick up where you left off.</p>
        </div>

        <p class="notice notice--success" id="flash" role="status" hidden></p>
        <p class="notice notice--danger" id="login-error" role="alert" hidden></p>

        <form class="form" id="login-form">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn--block">Log in</button>
        </form>
      </div>
      <p class="auth__foot">New here? <a href="signup.html">Create an account</a></p>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
